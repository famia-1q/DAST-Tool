<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scan Progress - iSeeWaves</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: radial-gradient(circle at top right, #0a192f 0%, #02040a 100%); color: #e6f1ff; min-height: 100vh; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 100px auto; background: #0a192f; border: 1px solid #1e3a5f; border-radius: 12px; padding: 40px; text-align: center; }
        h1 { color: #00e5ff; margin-bottom: 30px; }
        .progress-bar { width: 100%; height: 40px; background: #02040a; border-radius: 20px; overflow: hidden; margin: 20px 0; border: 2px solid #1e3a5f; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00e5ff, #667eea); transition: width 0.5s ease; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 1.2em; }
        .status-message { font-size: 1.3em; color: #8892b0; margin: 20px 0; min-height: 30px; }
        .spinner { border: 5px solid #1e3a5f; border-top: 5px solid #00e5ff; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn { display: inline-block; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 14px 28px; text-decoration: none; border-radius: 8px; font-weight: 600; margin: 10px; }
        .hidden { display: none; }
        .success-box { background: rgba(40, 167, 69, 0.1); border: 2px solid #28a745; border-radius: 8px; padding: 20px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Security Scan in Progress</h1>
        <div class="spinner" id="spinner"></div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%">0%</div></div>
        <div class="status-message" id="statusMessage">Initializing scan...</div>
        <div id="completeSection" class="hidden">
            <div class="success-box"><h2 style="color: #28a745; margin-top: 0;">✅ Scan Completed Successfully!</h2><p>Your security assessment has been completed.</p></div>
            <a href="/results/{{ scan_id }}" class="btn">📊 View Findings Dashboard</a>
            <a href="/report/{{ scan_id }}" class="btn">📄 Download PDF Report</a>
            <a href="/" class="btn" style="background: #6c757d;">← New Scan</a>
        </div>
    </div>
    <script>
        const scanId = '{{ scan_id }}';
        let pollInterval;
        function updateStatus() {
            fetch(`/api/scan/${scanId}/status`).then(r => r.json()).then(data => {
                document.getElementById('progressFill').style.width = data.progress + '%';
                document.getElementById('progressFill').textContent = data.progress + '%';
                document.getElementById('statusMessage').textContent = data.message;
                if (data.status === 'complete') {
                    clearInterval(pollInterval);
                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('completeSection').classList.remove('hidden');
                } else if (data.status === 'failed') {
                    clearInterval(pollInterval);
                    document.getElementById('statusMessage').style.color = '#dc3545';
                }
            });
        }
        pollInterval = setInterval(updateStatus, 2000);
        updateStatus();
    </script>
</body>
</html>
